# Legacy color codes: &e yellow, &f white, &a green, &b cyan, &l bold, &r reset.
# {amount} is reward.display-amount; it is a label, not payment verification.
prefix: '&e&l[Arcane]&r &f'
announcement: '&f{newcomer} is new! Type welcome {newcomer} to welcome them.'
reward: '&fReward command sent for &a&l{amount}&r&f. Thanks for welcoming {newcomer}!'
already: '&fYou already welcomed this player.'
self: '&fYou cannot welcome yourself.'
closed: '&fThat player is not currently accepting welcomes.'
failed: '&fReward could not be dispatched. Contact an administrator.'
busy: '&fYour previous welcome is still being processed.'
reloaded: '&fArcaneWelcome configuration reloaded.'
invalid-config: '&fInvalid configuration; previous settings remain active. Check the console.'
test-started: '&fTest started. Type welcome {newcomer}. Real rewards: {paid}.'
test-stopped: '&fYour test session ended.'
hologram-preview: '&fShowing your private welcome title.'
no-permission: '&fYou do not have permission.'
usage: '&f/arcanew reload | /arcanew test join | /arcanew test hologram | /arcanew test stop'
